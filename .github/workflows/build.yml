name: Android APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      gradle_task:
        description: "Optional Gradle task (leave empty for auto-detect)"
        required: false
        default: ""
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          echo "Workspace: $GITHUB_WORKSPACE"
          find . -maxdepth 4 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "gradlew" \
          \) | sort | head -200

          ROOT=""

          # Prefer a Gradle wrapper.
          WRAPPER="$(find . -type f -name gradlew -print -quit || true)"
          if [ -n "$WRAPPER" ]; then
            ROOT="$(dirname "$WRAPPER")"
          fi

          # Otherwise locate settings.gradle/settings.gradle.kts.
          if [ -z "$ROOT" ]; then
            SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit || true)"
            if [ -n "$SETTINGS" ]; then
              ROOT="$(dirname "$SETTINGS")"
            fi
          fi

          # Fallback: directory containing a Gradle build file.
          if [ -z "$ROOT" ]; then
            BUILD="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit || true)"
            if [ -n "$BUILD" ]; then
              ROOT="$(dirname "$BUILD")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Tidak ditemukan proyek Gradle Android."
            exit 1
          fi

          ROOT="${ROOT#./}"
          [ "$ROOT" = "." ] && ROOT="."

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Detected project root: $ROOT"

          # Detect whether an Android app module exists.
          if find "$ROOT" -type f -name "AndroidManifest.xml" -path "*/src/main/*" | grep -q .; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install common Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest" || true

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper tidak ditemukan."
            echo "Mencoba Gradle yang tersedia di runner..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "::error::gradlew tidak ada dan Gradle system tidak tersedia."
              exit 1
            fi

            gradle --version
          fi

      - name: Detect Gradle task
        id: task
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        env:
          REQUESTED_TASK: ${{ inputs.gradle_task }}
          REQUESTED_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_TASK:-}" ]; then
            echo "task=$REQUESTED_TASK" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TYPE="${REQUESTED_TYPE:-release}"
          if [ "$TYPE" = "debug" ]; then
            CANDIDATES=(
              "assembleDebug"
              ":app:assembleDebug"
            )
          else
            CANDIDATES=(
              "assembleRelease"
              ":app:assembleRelease"
            )
          fi

          TASK=""
          for candidate in "${CANDIDATES[@]}"; do
            if [ -f "./gradlew" ]; then
              if ./gradlew tasks --all --no-daemon --console=plain 2>/dev/null | grep -Fxq ".*${candidate}"; then
                TASK="$candidate"
                break
              fi
            else
              if gradle tasks --all --no-daemon --console=plain 2>/dev/null | grep -Fxq ".*${candidate}"; then
                TASK="$candidate"
                break
              fi
            fi
          done

          # More flexible task detection for projects with custom modules/flavors.
          if [ -z "$TASK" ]; then
            if [ -f "./gradlew" ]; then
              TASK="$(
                ./gradlew tasks --all --no-daemon --console=plain 2>/dev/null |
                grep -E '^[[:space:]]+[A-Za-z0-9_:.-]*assemble[A-Za-z0-9_:.-]*(Release|Debug)[[:space:]]*$' |
                sed 's/^[[:space:]]*//' |
                head -n 1 || true
              )"
            else
              TASK="$(
                gradle tasks --all --no-daemon --console=plain 2>/dev/null |
                grep -E '^[[:space:]]+[A-Za-z0-9_:.-]*assemble[A-Za-z0-9_:.-]*(Release|Debug)[[:space:]]*$' |
                sed 's/^[[:space:]]*//' |
                head -n 1 || true
              )"
            fi
          fi

          if [ -z "$TASK" ]; then
            echo "::error::Tidak menemukan task assemble APK. Gunakan input gradle_task secara manual."
            exit 1
          fi

          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK"

      - name: Build APK
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        env:
          GRADLE_TASK: ${{ steps.task.outputs.task }}
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew "$GRADLE_TASK" \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain
          else
            gradle "$GRADLE_TASK" \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain
          fi

      - name: Collect APK
        id: collect
        working-directory: ${{ steps.detect.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          mapfile -t APKS < <(
            find . -type f -name "*.apk" \
              -not -path "*/.gradle/*" \
              -not -path "*/build/intermediates/*" \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            # Second pass, in case the project stores APKs in an unusual output folder.
            mapfile -t APKS < <(
              find . -type f -iname "*.apk" -print | sort
            )
          fi

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Build selesai tetapi file APK tidak ditemukan."
            find . -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK ditemukan:"
          printf '%s\n' "${APKS[@]}"

          INDEX=0
          for APK in "${APKS[@]}"; do
            INDEX=$((INDEX + 1))
            BASE="$(basename "$APK")"
            if [ "$INDEX" -eq 1 ]; then
              DEST="$GITHUB_WORKSPACE/apk-output/$BASE"
            else
              DEST="$GITHUB_WORKSPACE/apk-output/${INDEX}_$BASE"
            fi
            cp "$APK" "$DEST"
          done

          ls -lah "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android Build"
            echo ""
            echo "- Project root: \`${{ steps.detect.outputs.root }}\`"
            echo "- Gradle task: \`${{ steps.task.outputs.task }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "### APK"
            if [ -d apk-output ]; then
              find apk-output -type f -name "*.apk" -printf '%f (%s bytes)\n' | sort
            else
              echo "Tidak ada output APK."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
