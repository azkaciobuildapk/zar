name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw ==="
          find project_raw | head -50

          echo ""
          echo "=== Mengunci Project Dir (Manut Mode) ==="
          
          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo "✅ Project root langsung dikunci di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER (only when pubspec.yaml exists)
      # =========================
      - name: Setup Flutter
        if: ${{ hashFiles('**/pubspec.yaml') != '' }}
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 1: Jalankan & cetak hasil
      # (Dipisah dari exit 1 biar log tidak ter-truncate)
      # ==========================================================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."

            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt

          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 2: Stop workflow jika only_analyze
      # (Dipisah biar log step di atas sudah ter-commit ke GitHub)
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 1

      # =========================
      # FLUTTER DOCTOR (OPTIONAL)
      # =========================
      - name: Flutter Doctor
        if: ${{ hashFiles('**/pubspec.yaml') != '' }}
        run: flutter doctor

      # ==========================================================
      # 🔎 DETECT PROJECT TYPE + ROOT
      # Supports Flutter and native Android projects such as:
      # project/android/gradlew
      # project/android/app/src/main/...
      # ==========================================================
      - name: Detect Project
        run: |
          set -e
          echo "=== Detecting project structure ==="

          if [ -f "${PROJECT_DIR}/pubspec.yaml" ]; then
            echo "PROJECT_TYPE=flutter" >> "$GITHUB_ENV"
            echo "BUILD_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
            echo "✅ Flutter project: ${PROJECT_DIR}"

          elif [ -f "${PROJECT_DIR}/android/gradlew" ]; then
            echo "PROJECT_TYPE=android" >> "$GITHUB_ENV"
            echo "BUILD_DIR=${PROJECT_DIR}/android" >> "$GITHUB_ENV"
            echo "✅ Native Android project: ${PROJECT_DIR}/android"

          elif [ -f "${PROJECT_DIR}/gradlew" ]; then
            echo "PROJECT_TYPE=android" >> "$GITHUB_ENV"
            echo "BUILD_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
            echo "✅ Native Android project: ${PROJECT_DIR}"

          else
            echo "❌ pubspec.yaml atau gradlew tidak ditemukan."
            echo "Struktur yang didukung:"
            echo "  project/pubspec.yaml"
            echo "  project/android/gradlew"
            echo "  project/gradlew"
            exit 1
          fi

          echo ""
          echo "=== Android/Gradle files ==="
          find "${PROJECT_DIR}" -maxdepth 5 -type f \(             -name "gradlew" -o             -name "settings.gradle" -o             -name "settings.gradle.kts" -o             -name "build.gradle" -o             -name "build.gradle.kts" -o             -name "AndroidManifest.xml"           \) -print | sort | head -100

      # ==========================================================
      # 📦 DEPENDENCIES
      # ==========================================================
      - name: Get Dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e

          if [ "$PROJECT_TYPE" = "flutter" ]; then
            echo "=== flutter pub get ==="
            flutter pub get
          else
            echo "=== Native Android Gradle setup ==="

            # local.properties dari komputer asal ZIP dapat berisi path SDK
            # yang tidak berlaku di GitHub runner. Pakai SDK runner.
            echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

            chmod +x ./gradlew
            ./gradlew --version
          fi

      # ==========================================================
      # 🚀 BUILD APK
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e

          echo "=== Building APK ==="
          echo "Project type: $PROJECT_TYPE"
          echo "Build type  : ${{ github.event.inputs.build_type }}"

          if [ "$PROJECT_TYPE" = "flutter" ]; then
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              flutter build apk --debug
            else
              flutter build apk --release
            fi
          else
            chmod +x ./gradlew

            # Struktur sesuai screenshot:
            # android/
            # ├── app/
            # │   ├── src/main/
            # │   │   ├── assets/
            # │   │   ├── java/
            # │   │   ├── res/
            # │   │   └── AndroidManifest.xml
            # │   ├── build.gradle
            # │   └── proguard-rules.pro
            # ├── gradle/wrapper/gradle-wrapper.properties
            # ├── build.gradle
            # ├── gradle.properties
            # ├── settings.gradle
            # └── gradlew

            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              echo "🚀 ./gradlew clean assembleDebug"
              ./gradlew clean assembleDebug --stacktrace
            else
              echo "🚀 ./gradlew clean assembleRelease"
              ./gradlew clean assembleRelease --stacktrace
            fi
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          set -e
          echo "=== APK Output Scanning ==="

          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          APK_FOUND=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan setelah build."
            echo ""
            echo "=== Possible build outputs ==="
            find "$GITHUB_WORKSPACE" -type d \( -name build -o -name outputs \) -print | head -50
            exit 1
          fi

          echo "✅ APK ditemukan: $APK_FOUND"
          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"

          echo ""
          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"

      # =========================
      # UPLOAD APK ARTIFACT
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error
