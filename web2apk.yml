name: Web to APK Builder

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website yang ingin dibungkus menjadi APK"
        required: true
        type: string
      app_name:
        description: "Nama aplikasi"
        required: true
        default: "Web App"
        type: string
      package_name:
        description: "Package name, contoh: com.example.webapp"
        required: true
        default: "com.example.webapp"
        type: string
      version_name:
        description: "Versi aplikasi"
        required: true
        default: "1.0"
        type: string
      build_type:
        description: "Jenis APK"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate inputs
        shell: bash
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          if [[ ! "$WEB_URL" =~ ^https?:// ]]; then
            echo "::error::web_url harus diawali http:// atau https://"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]]; then
            echo "::error::package_name tidak valid."
            exit 1
          fi

          if [ -z "$APP_NAME" ]; then
            echo "::error::app_name tidak boleh kosong."
            exit 1
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::version_name tidak boleh kosong."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

      - name: Generate WebView Android project
        shell: bash
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          rm -rf web2apk
          mkdir -p \
            web2apk/app/src/main/java \
            web2apk/app/src/main/res/layout \
            web2apk/app/src/main/res/values \
            web2apk/app/src/main/res/xml

          PKG_PATH="${PACKAGE_NAME//.//}"
          mkdir -p "web2apk/app/src/main/java/$PKG_PATH"

          cat > web2apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Web2APK"
          include(":app")
          EOF

          cat > web2apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > web2apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > web2apk/app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace '${PACKAGE_NAME}'
              compileSdk 35

              defaultConfig {
                  applicationId '${PACKAGE_NAME}'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '${VERSION_NAME}'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

          cat > web2apk/app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          cat > web2apk/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#3F51B5</item>
              </style>
          </resources>
          EOF

          cat > web2apk/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <ProgressBar
                  android:id="@+id/progressBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center" />

          </FrameLayout>
          EOF

          cat > "web2apk/app/src/main/java/$PKG_PATH/MainActivity.java" <<EOF
          package ${PACKAGE_NAME};

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;

          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private ProgressBar progressBar;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  progressBar = findViewById(R.id.progressBar);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("${WEB_URL}");

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {
                          @Override
                          public void handleOnBackPressed() {
                              if (webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  finish();
                              }
                          }
                      }
                  );
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > web2apk/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          # Generate a minimal Gradle wrapper from the runner's Gradle if available.
          cd web2apk
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          else
            echo "::error::Gradle tidak tersedia di runner."
            exit 1
          fi

          chmod +x gradlew

      - name: Build APK
        working-directory: web2apk
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain
          else
            ./gradlew :app:assembleRelease \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              --console=plain
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p apk-output

          find web2apk/app/build/outputs/apk \
            -type f -name "*.apk" \
            -exec cp {} apk-output/ \;

          if ! find apk-output -type f -name "*.apk" | grep -q .; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          ls -lah apk-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_number }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Web → APK"
            echo ""
            echo "- Website: \`${{ inputs.web_url }}\`"
            echo "- App: \`${{ inputs.app_name }}\`"
            echo "- Package: \`${{ inputs.package_name }}\`"
            echo "- Version: \`${{ inputs.version_name }}\`"
            echo "- Build: \`${{ inputs.build_type }}\`"
            echo ""
            echo "### APK"
            find apk-output -type f -name "*.apk" -printf '%f (%s bytes)\n' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
